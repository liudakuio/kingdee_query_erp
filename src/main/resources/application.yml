server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # demo = 内置 H2 演示库（开箱即用）；kingdee = 真实金蝶数据库
  profiles:
    active: kingdee
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    throw-exception-if-no-handler-found: false

mybatis:
  mapper-locations: classpath*:mapper/receive/*.xml
  configuration:
    # 结果集映射为 entity 时，值为 NULL 的列也调用 setter，保证字段状态一致
    call-setters-on-nulls: true

kingdee:
  query:
    # 单张表最多返回行数（防止自定义子表数据量过大拖垮页面）
    max-rows-per-table: 2000
    # 模糊匹配最多返回的单据数量
    max-candidates: 50
    # IN 条件分批大小（Oracle IN 上限 1000）
    in-clause-batch-size: 500
    # 单次批量查询/导出最多允许的单号数量
    max-batch-bills: 20
  vehicleplan:
    # 采购车辆计划数据库（独立数据源，与收货单主库不同）
    # 这里默认指向内置 H2 空库，保证任何 profile 都能启动；
    # 真实 PostgreSQL 连接写在本地 application-kingdee.yml（该文件不纳入版本控制）
    datasource:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:mem:vehicleplan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
      hikari:
        maximum-pool-size: 3
